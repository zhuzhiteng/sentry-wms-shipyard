site_name: 船厂仓储管理系统
site_description: 船厂到货、库存、正式出库与装车追溯
site_url: https://zhuzhiteng.github.io/sentry-wms-shipyard/
repo_url: https://github.com/zhuzhiteng/sentry-wms-shipyard
repo_name: zhuzhiteng/sentry-wms-shipyard

theme:
  name: material
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Instrument Sans
    code: JetBrains Mono
  logo: assets/logo.png
  favicon: assets/logo.png
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

nav:
  - 首页: index.md
  - 部署: deployment.md
  - 船厂仓储:
      - 基线与状态: shipyard/baseline.md
      - 入库清单: shipyard/inbound-api.md
      - 拍照识别收货: shipyard/receipt-api.md
      - 正式出库与装车: shipyard/formal-outbound-api.md
      - 真实吊牌 OCR 验收: shipyard/ocr-acceptance.md
      - 备份恢复演练: shipyard/recovery-drill.md
      - 生产监控与备份: shipyard/production-operations.md
      - 风险闭环台账: shipyard/risk-register.md
  - 测试手册: test-lab.md
  - 贡献指南: contributing.md

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
